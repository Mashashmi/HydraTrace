<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydraTrace Dashboard</title>

    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts dependencies -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
    
    <!-- Recharts (Pinned to stable UMD version) -->
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, 
            Legend, ResponsiveContainer, PieChart, Pie, Cell, LineChart, Line, ComposedChart, LabelList
        } = window.Recharts;

        // --- ICON COMPONENTS ---
        const IconDroplet = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path></svg>);
        const IconDashboard = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>);
        const IconSettings = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>);
        const IconPlus = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>);
        const IconTrending = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>);
        const IconLineChart = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 3 3 21 21 21"></polyline><polyline points="3 14 8 9 13 14 21 6"></polyline></svg>);
        const IconTable = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="9" x2="9" y2="21"></line><line x1="15" y1="9" x2="15" y2="21"></line></svg>);
        const IconTrash = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>);
        const IconEdit = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>);
        const IconDownload = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>);
        const IconCalendar = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>);
        const IconActivity = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>);
        const IconInventory = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>);
        const IconWarning = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>);
        const IconTruck = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>);
        const IconCloud = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>);
        const IconCloudOff = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22.61 16.95A4.5 4.5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a4.5 4.5 0 0 0 1.73-.35"/><line x1="2" y1="2" x2="22" y2="22"/></svg>);
        const IconPlant = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a10 10 0 0 1 8 4h-2a8 8 0 0 0-12 0H4a10 10 0 0 1 8-4z"/><path d="M12 10a6 6 0 0 1 4.5 2H19a8 8 0 0 0-14 0h2.5A6 6 0 0 1 12 10z"/><path d="M12 18a2 2 0 0 1 1 0.27V22h-2v-3.73a2 2 0 0 1 1-.27z"/></svg>);
        const IconCheck = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>);
        const IconX = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>);
        const IconLock = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>);
        const IconLogout = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>);

        // Local testing API URL
        const API_URL = 'https://mashashmi.pythonanywhere.com/api/data';

        const DEFAULT_PLANTS_CONFIG = {
            "Main Plant": {
                "AP3": ["Entry Power Pack", "Shear Welder Power Pack", "Steering#1,2&3 Power Pack", "Steering#4 Power Pack", "Scale Breaker Power Pack", "Steering#4A Power Pack", "Steering#5 Power Pack", "Edge Guide Power Pack", "Exit Power Pack"],
                "CP1": ["Aux Power Pack", "Edge Guide Power Pack"],
                "CP2": ["CPC Power Pack (Uncoiler)", "Aux Power Pack", "Edge Guide Power Pack (Recoiler)"],
                "CP3": ["Aux Power Pack"]
            }
        };

        const INITIAL_RECORDS = [
            { id: '1', date: '2026-07-02', shift: 'Shift A', plant: 'Main Plant', line: 'AP3', powerPack: 'Exit Power Pack', tankLevel: 80, amount: 210, person: 'SANJAY ROHILLA', pressure: 120, temperature: 46, runningPump: 'Main Pump', mainPumpStatus: 'OK', standbyPumpStatus: 'OK', elcStatus: 'OK' },
            { id: '2', date: '2026-07-13', shift: 'Shift A', plant: 'Main Plant', line: 'CP1', powerPack: 'Aux Power Pack', tankLevel: 65, amount: 40, person: 'SANJAY ROHILLA', pressure: 110, temperature: 38, runningPump: 'Main Pump', mainPumpStatus: 'OK', standbyPumpStatus: 'OK', elcStatus: 'OK' },
            { id: '3', date: '2026-07-13', shift: 'Shift B', plant: 'Main Plant', line: 'CP2', powerPack: 'CPC Power Pack (Uncoiler)', tankLevel: 55, amount: 30, person: 'SANJAY ROHILLA', pressure: 115, temperature: 40, runningPump: 'Standby Pump', mainPumpStatus: 'Not OK', standbyPumpStatus: 'OK', elcStatus: 'Cleaning Required' }
        ];

        const CustomPieLabel = ({ cx, cy, midAngle, innerRadius, outerRadius, name, value }) => {
            const RADIAN = Math.PI / 180;
            const radius = innerRadius + (outerRadius - innerRadius) * 0.5; 
            const x = cx + radius * Math.cos(-midAngle * RADIAN);
            const y = cy + radius * Math.sin(-midAngle * RADIAN);
            
            if (value === 0) return null;

            return (
                <text x={x} y={y} fill="#ffffff" textAnchor="middle" dominantBaseline="central" className="text-xs font-bold" style={{ textShadow: '0px 1px 3px rgba(0,0,0,0.7)' }}>
                    {`${name}: ${value}L`}
                </text>
            );
        };

        const CustomTrendTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const data = payload[0].payload;
                return (
                    <div className="bg-white p-3 rounded-lg shadow-md border border-slate-200 text-xs min-w-[220px] z-50">
                        <p className="font-bold text-slate-800 mb-2 border-b border-slate-100 pb-1 text-sm">{label}</p>
                        <div className="space-y-1.5 mb-3">
                            {payload.map((entry, index) => (
                                (entry.value > 0 || entry.value !== null) ? (
                                    <div key={index} className="flex justify-between items-center gap-4">
                                        <span style={{color: entry.color}} className="font-semibold">{entry.name}:</span>
                                        <span className="font-bold text-slate-700">{entry.value}</span>
                                    </div>
                                ) : null
                            ))}
                        </div>
                        {(data.pressure || data.temperature || data.runningPump !== '--' || data.elcStatus !== '--') && (
                            <div className="mt-2 pt-2 border-t border-slate-100 bg-slate-50 -mx-3 -mb-3 p-3 rounded-b-lg">
                                <div className="font-bold text-[10px] text-slate-500 uppercase tracking-wider mb-2 border-b border-slate-200 pb-1">Machine Status</div>
                                <div className="grid grid-cols-2 gap-x-2 gap-y-1.5 text-[11px]">
                                    <div className="text-slate-500 font-medium">Running:</div>
                                    <div className="font-bold text-slate-800 text-right">{data.runningPump}</div>
                                    <div className="text-slate-500 font-medium">Main Pump:</div>
                                    <div className={`font-bold text-right ${data.mainStatus === 'OK' ? 'text-emerald-600' : data.mainStatus === '--' ? 'text-slate-400' : 'text-red-500'}`}>{data.mainStatus}</div>
                                    <div className="text-slate-500 font-medium">Stdby Pump:</div>
                                    <div className={`font-bold text-right ${data.stdbyStatus === 'OK' ? 'text-emerald-600' : data.stdbyStatus === '--' ? 'text-slate-400' : 'text-red-500'}`}>{data.stdbyStatus}</div>
                                    <div className="text-slate-500 font-medium mt-1">ELC Machine:</div>
                                    <div className={`font-bold text-right mt-1 ${data.elcStatus === 'OK' ? 'text-emerald-600' : data.elcStatus === 'Cleaning Required' ? 'text-amber-500' : data.elcStatus === '--' ? 'text-slate-400' : 'text-red-500'}`}>{data.elcStatus}</div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }
            return null;
        };

        function App() {
            // --- AUTH STATE ---
            const [currentUser, setCurrentUser] = useState(() => {
                const savedSession = localStorage.getItem('hydraulicCurrentSession');
                if (savedSession) {
                    try { return JSON.parse(savedSession); } catch(e) {}
                }
                return null;
            }); 
            
            const [authCredentials, setAuthCredentials] = useState(() => {
                const saved = localStorage.getItem('hydraulicAuthConfig');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return { admin: 'admin', plants: { "Main Plant": "1234" } };
            });

            // Login UI State
            const [loginRole, setLoginRole] = useState('plant');
            const [loginPlant, setLoginPlant] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            // --- APP STATE ---
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedMonth, setSelectedMonth] = useState('All');
            const [activePlantContext, setActivePlantContext] = useState('All'); 
            const [editingId, setEditingId] = useState(null);
            
            // Cloud Sync States
            const [isOnline, setIsOnline] = useState(false);
            const [syncStatus, setSyncStatus] = useState('Checking Connection...');

            // Database States
            const [plantsConfig, setPlantsConfig] = useState(() => {
                const savedNew = localStorage.getItem('hydraulicPlantsConfig');
                if (savedNew) {
                    try { return JSON.parse(savedNew); } catch(e){}
                }
                return DEFAULT_PLANTS_CONFIG;
            });

            const [powerPackSpecs, setPowerPackSpecs] = useState(() => {
                const saved = localStorage.getItem('hydraulicSpecs');
                return saved ? JSON.parse(saved) : {};
            });

            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('hydraulicDataDB');
                let parsed = INITIAL_RECORDS;
                if (saved) { try { parsed = JSON.parse(saved); } catch (e) {} }
                const defaultPlant = Object.keys(plantsConfig)[0] || 'Main Plant';
                return parsed.map(r => ({ ...r, plant: r.plant || defaultPlant }));
            });

            const [inventoryState, setInventoryState] = useState(() => {
                const saved = localStorage.getItem('hydraulicInventory');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.currentStock !== undefined) return { "Main Plant": { ...parsed, loanedStock: parsed.loanedStock || 0 } };
                        return parsed;
                    } catch(e) {}
                }
                return { "Main Plant": { currentStock: 1500, safetyStock: 300, loanedStock: 0 } };
            });

            const [inventoryLogs, setInventoryLogs] = useState(() => {
                const saved = localStorage.getItem('hydraulicInventoryLogs');
                if (saved) { try { return JSON.parse(saved).map(log => ({...log, plant: log.plant || "Main Plant"})); } catch(e){} }
                return [];
            });

            // Initialize Login Plant Selection
            useEffect(() => {
                const plants = Object.keys(plantsConfig);
                if (plants.length > 0 && !loginPlant) setLoginPlant(plants[0]);
            }, [plantsConfig, loginPlant]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginRole === 'admin') {
                    if (loginPassword === authCredentials.admin) {
                        const userSession = { role: 'admin' };
                        setCurrentUser(userSession);
                        localStorage.setItem('hydraulicCurrentSession', JSON.stringify(userSession));
                        setActivePlantContext('All');
                        setLoginError('');
                    } else {
                        setLoginError('Invalid Admin Password');
                    }
                } else {
                    const pass = authCredentials.plants[loginPlant] || '1234';
                    if (loginPassword === pass) {
                        const userSession = { role: 'plant', plantName: loginPlant };
                        setCurrentUser(userSession);
                        localStorage.setItem('hydraulicCurrentSession', JSON.stringify(userSession));
                        setActivePlantContext(loginPlant);
                        setLoginError('');
                    } else {
                        setLoginError('Invalid Plant Password');
                    }
                }
                setLoginPassword('');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('hydraulicCurrentSession');
                setLoginPassword('');
                setLoginError('');
                setActiveTab('overview');
            };

            const getTodayDate = () => new Date().toISOString().split('T')[0];
            const [formData, setFormData] = useState({
                date: getTodayDate(), shift: 'General', plant: '', line: '', powerPack: '', tankLevel: '', amount: '', person: '',
                pressure: '', temperature: '', runningPump: 'Main Pump', mainPumpStatus: 'OK', standbyPumpStatus: 'OK', elcStatus: 'OK'
            });

            // UI specific states
            const [editingSpecKey, setEditingSpecKey] = useState(null);
            const [specForm, setSpecForm] = useState({ dimensions: '', alarmLevel: '', tripLevel: '' });
            const [detailsPlant, setDetailsPlant] = useState('');
            const [detailsLine, setDetailsLine] = useState('');
            const [trendPlant, setTrendPlant] = useState('');
            const [trendLine, setTrendLine] = useState('');
            const [trendPack, setTrendPack] = useState('');
            const [logLineFilter, setLogLineFilter] = useState('All');
            const [showOnlyTopUps, setShowOnlyTopUps] = useState(false);
            
            // Config specific states
            const [newPlantInput, setNewPlantInput] = useState('');
            const [editingPlantId, setEditingPlantId] = useState(null);
            const [editPlantNameInput, setEditPlantNameInput] = useState('');
            const [selectedConfigPlant, setSelectedConfigPlant] = useState('');
            const [newLineInput, setNewLineInput] = useState('');
            const [selectedConfigLine, setSelectedConfigLine] = useState('');
            const [newPackInput, setNewPackInput] = useState('');
            const [invPlantContext, setInvPlantContext] = useState('');
            const [configError, setConfigError] = useState('');

            const showError = (msg) => { setConfigError(msg); setTimeout(() => setConfigError(''), 5000); };

            // Lock context if Plant User
            useEffect(() => {
                if (currentUser?.role === 'plant') {
                    setActivePlantContext(currentUser.plantName);
                    setDetailsPlant(currentUser.plantName);
                    setTrendPlant(currentUser.plantName);
                    setInvPlantContext(currentUser.plantName);
                    setFormData(prev => ({ ...prev, plant: currentUser.plantName }));
                }
            }, [currentUser]);

            const inventoryMetrics = useMemo(() => {
                const today = new Date(); let dailyAvg = 5; 
                if (plantRecords.length > 0) {
                    const sortedDates = [...plantRecords].map(r => new Date(r.date)).sort((a,b) => a-b);
                    const daysDiff = Math.max(1, Math.ceil(Math.abs(sortedDates[sortedDates.length - 1] - sortedDates[0]) / (1000 * 60 * 60 * 24)));
                    const totalVol = plantRecords.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
                    dailyAvg = totalVol / daysDiff;
                    if (dailyAvg === 0) dailyAvg = 5;
                }
                const daysRemaining = Math.max(0, Math.floor(currentPlantInv.currentStock / dailyAvg));
                const depletionDate = new Date(today); depletionDate.setDate(depletionDate.getDate() + daysRemaining);
                const forecastData = []; let simulatedStock = currentPlantInv.currentStock;
                for(let i=0; i<=30; i++) {
                    const fDate = new Date(today); fDate.setDate(fDate.getDate() + i);
                    forecastData.push({ date: fDate.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}), projectedStock: Math.max(0, Math.round(simulatedStock)), safetyLimit: currentPlantInv.safetyStock });
                    simulatedStock -= dailyAvg;
                }
                return {
                    dailyAvg: dailyAvg.toFixed(1), daysRemaining,
                    depletionDate: isNaN(depletionDate.getTime()) ? 'Unknown' : depletionDate.toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'}),
                    forecastData, status: daysRemaining < 10 ? 'CRITICAL' : daysRemaining < 30 ? 'WARNING' : 'HEALTHY',
                    colorClass: daysRemaining < 10 ? 'text-red-600' : daysRemaining < 30 ? 'text-amber-600' : 'text-emerald-600',

            const handleSubmitRecord = (e) => {
                e.preventDefault();

                    } : r);

                                                        <input type="number" name="amount" value={formData.amount} onChange={handleFormChange} min="0" step="0.1" placeholder="e.g. 40" className="w-full p-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none" />
                                                    </div>
                                                </div>

                                                {/* DIAGNOSTICS SECTION */}
                                                <div className="pt-4 mt-2 border-t border-slate-100">
                                                    <h4 className="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2"><IconActivity size={16} className="text-blue-500"/> Machine Diagnostics (Optional)</h4>
                                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                                        <div>
                                                            <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wide">Pressure (bar)</label>
                                                            <input type="number" name="pressure" value={formData.pressure} onChange={handleFormChange} step="0.1" placeholder="e.g. 120" className="w-full p-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wide">Temperature (°C)</label>
                                                            <input type="number" name="temperature" value={formData.temperature} onChange={handleFormChange} step="0.1" placeholder="e.g. 45" className="w-full p-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" />
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-1 gap-4 mb-2">
                                                        <div className="grid grid-cols-3 gap-4">
                                                            <div>
                                                                <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wide">Running Pump</label>
                                                                <select name="runningPump" value={formData.runningPump} onChange={handleFormChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
                                                                    <option value="Main Pump">Main Pump</option><option value="Standby Pump">Standby Pump</option>
                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wide">Main Status</label>
                                                                <select name="mainPumpStatus" value={formData.mainPumpStatus} onChange={handleFormChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
                                                                    <option value="OK">OK</option><option value="Not OK">Not OK</option>
                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wide">Stdby Status</label>
                                                                <select name="standbyPumpStatus" value={formData.standbyPumpStatus} onChange={handleFormChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
                                                                    <option value="OK">OK</option><option value="Not OK">Not OK</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wide">ELC Status</label>
                                                            <select name="elcStatus" value={formData.elcStatus} onChange={handleFormChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none text-sm">
                                                                <option value="OK">OK</option><option value="Cleaning Required">Cleaning Required</option><option value="Not OK">Not OK</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="pt-2 border-t border-slate-100">
                                                    <label className="block text-sm font-medium text-slate-700 mb-1">Personnel / Reason</label>
                                                    <input type="text" name="person" value={formData.person} onChange={handleFormChange} placeholder="e.g. Sanjay Rohilla" className="w-full p-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none" />
                                                </div>
                                                <button type="submit" className={`w-full text-white font-medium py-2.5 px-4 rounded-md transition-colors mt-4 shadow-sm ${editingId ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                                    {editingId ? 'Update Record' : 'Save Record'}
                                                </button>
                                            </form>
                                        </div>

                                        <div className="xl:col-span-2 space-y-6">
                                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                                                    <h3 className="text-lg font-bold text-slate-800">Equipment Logs <span className="text-sm font-normal text-slate-500">({formatMonth(selectedMonth)})</span></h3>
                                                    <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                                                        <button onClick={() => setShowOnlyTopUps(!showOnlyTopUps)} className={`px-3 py-1.5 text-sm font-medium rounded-md transition-colors border ${showOnlyTopUps ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                                                            {showOnlyTopUps ? 'Showing Top-ups' : 'Show All Logs'}
                                                        </button>
                                                        <select value={logLineFilter} onChange={(e) => setLogLineFilter(e.target.value)} className="p-1.5 text-sm border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none">
                                                            <option value="All">All Lines</option>
                                                            {viewAvailableLines.map(line => <option key={line} value={line}>{line}</option>)}
                                                        </select>
                                                        <div className="text-sm text-slate-500 whitespace-nowrap">Total: {activeRecords.filter(r => (logLineFilter === 'All' || r.line === logLineFilter) && (!showOnlyTopUps || (Number(r.amount) || 0) > 0)).length}</div>
                                                    </div>
                                                </div>
                                                
                                                <div className="overflow-x-auto rounded-lg border border-slate-200 max-h-[800px]">
                                                    <table className="w-full text-left border-collapse">
                                                        <thead className="bg-slate-50 sticky top-0 z-10">
                                                            <tr className="text-slate-500 text-sm border-b border-slate-200 shadow-sm">
                                                                <th className="p-3 font-medium">Date/Shift</th>
                                                                <th className="p-3 font-medium">Line / Pack</th>
                                                                <th className="p-3 font-medium text-center">Level</th>
                                                                <th className="p-3 font-medium text-center">Liters Added</th>
                                                                <th className="p-3 font-medium">Diagnostics</th>
                                                                <th className="p-3 font-medium">Personnel</th>
                                                                <th className="p-3 font-medium text-center">Actions</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {[...activeRecords].filter(r => (logLineFilter === 'All' || r.line === logLineFilter) && (!showOnlyTopUps || (Number(r.amount) || 0) > 0)).sort((a,b) => new Date(b.date) - new Date(a.date)).map(record => (
                                                                <tr key={record.id} className={`border-b border-slate-100 hover:bg-slate-50 transition-colors ${editingId === record.id ? 'bg-amber-50' : ''}`}>
                                                                    <td className="p-3 text-sm text-slate-700 whitespace-nowrap"><div className="font-medium">{record.date}</div><div className="text-xs text-slate-500">{record.shift || 'General'}</div></td>
                                                                    <td className="p-3">
                                                                        <div className="flex items-center gap-2 mb-1"><span className="px-2 py-0.5 text-[10px] font-bold rounded-md uppercase" style={{backgroundColor: `${COLORS[record.line] || '#64748b'}20`, color: COLORS[record.line] || '#64748b'}}>{record.line}</span></div>
                                                                        <div className="text-xs font-medium text-slate-700">{record.powerPack}</div>
                                                                    </td>
                                                                    <td className="p-3 text-sm text-slate-600 font-medium text-center">{record.tankLevel ? record.tankLevel : '--'}</td>
                                                                    <td className="p-3 text-sm font-bold text-slate-800 text-center">{record.amount > 0 ? <span className="text-emerald-600">+{record.amount} L</span> : <span className="text-slate-400 font-normal">0 L</span>}</td>
                                                                    <td className="p-3 text-[11px] leading-tight text-slate-600 min-w-[140px]">
                                                                        {record.pressure || record.temperature ? <div className="font-semibold text-slate-800">{record.pressure ? `P: ${record.pressure}bar ` : ''}{record.temperature ? `T: ${record.temperature}°C` : ''}</div> : null}
                                                                        {record.runningPump ? <div className="mt-0.5">Run: {record.runningPump === 'Main Pump' ? 'Main' : 'Stdby'}</div> : null}
                                                                        {(record.mainPumpStatus || record.pumpStatus || record.standbyPumpStatus) ? (
                                                                            <div className="mt-0.5">Main: <span className={(record.mainPumpStatus || record.pumpStatus) === 'OK' ? 'text-blue-600 font-medium' : 'text-red-500 font-bold'}>{record.mainPumpStatus || record.pumpStatus || '--'}</span> <span className="mx-1 text-slate-300">|</span> Stdby: <span className={record.standbyPumpStatus === 'OK' ? 'text-blue-600 font-medium' : record.standbyPumpStatus === 'Not OK' ? 'text-red-500 font-bold' : 'text-slate-500'}>{record.standbyPumpStatus || '--'}</span></div>
                                                                        ) : null}
                                                                        {record.elcStatus ? <div className="mt-0.5">ELC: <span className={record.elcStatus === 'OK' ? 'text-emerald-600 font-medium' : 'text-amber-600 font-bold'}>{record.elcStatus}</span></div> : null}
                                                                        {!record.pressure && !record.temperature && !record.runningPump && !record.elcStatus ? <span className="text-slate-400 italic">No diagnostics</span> : ''}
                                                                    </td>
                                                                    <td className="p-3 text-xs text-slate-600">{record.person || '--'}</td>
                                                                    <td className="p-3 text-center">
                                                                        <div className="flex items-center justify-center gap-3">
                                                                            <button onClick={() => handleEdit(record)} className="text-slate-400 hover:text-blue-500 transition-colors" title="Edit Record"><IconEdit size={16} /></button>
                                                                            <button onClick={() => handleDelete(record.id)} className="text-slate-400 hover:text-red-500 transition-colors" title="Delete Record"><IconTrash size={16} /></button>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                            {activeRecords.filter(r => (logLineFilter === 'All' || r.line === logLineFilter) && (!showOnlyTopUps || (Number(r.amount) || 0) > 0)).length === 0 && (
                                                                <tr><td colSpan="7" className="p-8 text-center text-slate-500 text-sm">No records match your filters.</td></tr>
                                                            )}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* PLANT CONFIG TAB (ADMIN ONLY) */}
                            {activeTab === 'plant-config' && currentUser.role === 'admin' && (
                                <div className="space-y-6">
                                    {configError && (
                                        <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg flex items-center justify-between shadow-sm animate-pulse">
                                            <div className="flex items-center gap-3 text-red-700"><IconWarning size={20} /><span className="font-semibold">{configError}</span></div>
                                            <button onClick={() => setConfigError('')} className="text-red-500 hover:text-red-700"><IconX size={20}/></button>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        
                                        {/* Security & Access Control */}
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 lg:col-span-3">
                                            <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                                <IconLock size={20} className="text-slate-400" /> Access Control & Passwords
                                            </h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                                                    <h4 className="font-bold text-slate-700 mb-1">Global Admin Account</h4>
                                                    <p className="text-xs text-slate-500 mb-3">Controls all plants and configurations.</p>
                                                    <div className="flex gap-2">
                                                        <input type="text" id="adminPassInput" defaultValue={authCredentials.admin} className="flex-1 p-2 border border-slate-300 rounded outline-none text-sm font-medium" />
                                                        <button onClick={() => updateAdminPassword(document.getElementById('adminPassInput').value)} className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded text-sm font-bold transition-colors">Update</button>
                                                    </div>
                                                </div>
                                                <div className="border border-slate-200 rounded-lg p-4 bg-slate-50 space-y-3">
                                                    <h4 className="font-bold text-slate-700 mb-1">Plant Accounts</h4>
                                                    <p className="text-xs text-slate-500 mb-3">Restricts users to their designated facility view.</p>
                                                    <div className="max-h-[150px] overflow-y-auto space-y-2 pr-2">
                                                        {Object.keys(plantsConfig).map(p => (
                                                            <div key={p} className="flex items-center justify-between gap-4">
                                                                <span className="font-bold text-sm text-slate-700 w-1/3 truncate" title={p}>{p}</span>
                                                                <div className="flex gap-2 flex-1">
                                                                    <input type="text" id={`pass_${p}`} defaultValue={authCredentials.plants[p] || '1234'} className="flex-1 p-1.5 border border-slate-300 rounded outline-none text-sm font-medium" />
                                                                    <button onClick={() => updatePlantPassword(p, document.getElementById(`pass_${p}`).value)} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-sm font-bold transition-colors">Set</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
                                            <div>
                                                <h3 className="text-lg font-bold text-slate-800 mb-2">Manage Plants / Facilities</h3>
                                                <p className="text-xs text-slate-500 mb-4 font-semibold text-red-500">Safeguard: Cannot delete a plant with existing records.</p>
                                            </div>
                                            <div className="space-y-4">
                                                <form onSubmit={handleAddPlant} className="flex gap-2">
                                                    <input type="text" value={newPlantInput} onChange={(e) => setNewPlantInput(e.target.value)} placeholder="New Plant Name" required className="flex-1 p-2 border border-slate-300 rounded-md outline-none focus:border-blue-500 text-sm font-bold uppercase" />
                                                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md font-medium text-sm">Add</button>
                                                </form>
                                                <div className="border border-slate-200 rounded-lg max-h-[200px] overflow-y-auto p-2 space-y-2">
                                                    {Object.keys(plantsConfig).map(plant => (
                                                        <div key={plant} className="flex justify-between items-center bg-slate-50 px-3 py-1.5 rounded-md border border-slate-100">
                                                            {editingPlantId === plant ? (
                                                                <div className="flex flex-1 items-center gap-2 mr-2">
                                                                    <input type="text" value={editPlantNameInput} onChange={(e) => setEditPlantNameInput(e.target.value)} className="flex-1 p-1 text-sm border border-slate-300 rounded outline-none focus:border-blue-500 font-bold" autoFocus />
                                                                    <button onClick={() => handleRenamePlant(plant)} className="text-emerald-600 hover:text-emerald-700 transition-colors" title="Save name"><IconCheck size={18} /></button>
                                                                    <button onClick={() => setEditingPlantId(null)} className="text-slate-400 hover:text-slate-600 transition-colors" title="Cancel"><IconX size={18} /></button>
                                                                </div>
                                                            ) : (
                                                                <>
                                                                    <span className="font-bold text-slate-800 text-sm">{plant}</span>
                                                                    <div className="flex items-center gap-3">
                                                                        <button onClick={() => { setEditingPlantId(plant); setEditPlantNameInput(plant); }} className="text-slate-400 hover:text-blue-500 transition-colors" title="Rename plant"><IconEdit size={16} /></button>
                                                                        <button onClick={() => handleRemovePlant(plant)} className="text-slate-400 hover:text-red-500 transition-colors" title="Delete plant"><IconTrash size={16} /></button>
                                                                    </div>
                                                                </>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
                                            <div>
                                                <h3 className="text-lg font-bold text-slate-800 mb-2">Configure Lines</h3>
                                                <div className="flex items-center gap-2 mb-4">
                                                    <span className="text-xs font-bold text-slate-500 uppercase">For Plant:</span>
                                                    <select value={selectedConfigPlant} onChange={(e) => setSelectedConfigPlant(e.target.value)} className="p-1 text-sm border border-slate-300 rounded font-semibold text-slate-700 flex-1 outline-none">
                                                        {Object.keys(plantsConfig).map(p => <option key={p} value={p}>{p}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="space-y-4">
                                                <form onSubmit={handleAddLine} className="flex gap-2">
                                                    <input type="text" value={newLineInput} onChange={(e) => setNewLineInput(e.target.value)} placeholder="Line Code (e.g. AP4)" required className="flex-1 p-2 border border-slate-300 rounded-md outline-none focus:border-blue-500 text-sm font-bold uppercase" />
                                                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md font-medium text-sm">Add</button>
                                                </form>
                                                <div className="border border-slate-200 rounded-lg max-h-[200px] overflow-y-auto p-2 space-y-2">
                                                    {Object.keys(plantsConfig[selectedConfigPlant] || {}).map(line => (
                                                        <div key={line} className="flex justify-between items-center bg-slate-50 px-3 py-1.5 rounded-md border border-slate-100">
                                                            <span className="font-bold text-slate-800 text-sm flex items-center gap-2"><span className="w-3 h-3 rounded-full" style={{backgroundColor: COLORS[line] || COLORS.Other}}></span>{line}</span>
                                                            <button onClick={() => handleRemoveLine(line)} className="text-slate-400 hover:text-red-500 transition-colors" title="Delete line"><IconTrash size={16} /></button>
                                                        </div>
                                                    ))}
                                                    {Object.keys(plantsConfig[selectedConfigPlant] || {}).length === 0 && <span className="text-xs text-slate-400 block text-center py-2">No lines assigned to this plant.</span>}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
                                            <div>
                                                <h3 className="text-lg font-bold text-slate-800 mb-2">Configure Power Packs</h3>
                                                <div className="flex items-center gap-2 mb-4">
                                                    <span className="text-xs font-bold text-slate-500 uppercase">Target Line:</span>
                                                    <select value={selectedConfigLine} onChange={(e) => setSelectedConfigLine(e.target.value)} className="p-1 text-sm border border-slate-300 rounded font-semibold text-slate-700 flex-1 outline-none">
                                                        {Object.keys(plantsConfig[selectedConfigPlant] || {}).map(l => <option key={l} value={l}>{l}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="space-y-4">
                                                {selectedConfigLine ? (
                                                    <>
                                                        <form onSubmit={handleAddPowerPack} className="flex gap-2">
                                                            <input type="text" value={newPackInput} onChange={(e) => setNewPackInput(e.target.value)} placeholder="Power Pack Name" required className="flex-1 p-2 border border-slate-300 rounded-md outline-none focus:border-blue-500 text-sm" />
                                                            <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium text-sm">Add</button>
                                                        </form>
                                                        <div className="border border-slate-200 rounded-lg max-h-[200px] overflow-y-auto p-2 space-y-1">
                                                            {(plantsConfig[selectedConfigPlant]?.[selectedConfigLine] || []).map(pack => (
                                                                <div key={pack} className="flex justify-between items-center bg-slate-50 px-2.5 py-1 rounded border border-slate-100 text-xs text-slate-700">
                                                                    <span>{pack}</span>
                                                                    <button onClick={() => handleRemovePowerPack(pack)} className="text-slate-400 hover:text-red-500 transition-colors" title="Delete power pack"><IconTrash size={14} /></button>
                                                                </div>
                                                            ))}
                                                            {(plantsConfig[selectedConfigPlant]?.[selectedConfigLine] || []).length === 0 && <div className="text-center text-xs text-slate-400 py-4">No power packs added yet.</div>}
                                                        </div>
                                                    </>
                                                ) : <div className="text-center text-xs text-slate-400 py-4">Select a line to configure power packs.</div>}
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
